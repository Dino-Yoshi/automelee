import com.gtnewhorizons.retrofuturagradle.mcp.InjectTagsTask

plugins {
    id 'java'
    id 'com.gtnewhorizons.retrofuturagradle' version '2.0.3'
    id 'com.diffplug.spotless' version '8.5.1'
}

group = 'automelee'
version = project.mod_version

base {
    archivesName = project.mod_id
}

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(8)
        // Azul covers the most platforms for Java 8 toolchains, including macOS arm64
        vendor = JvmVendorSpec.AZUL
    }
}

// Pack jars that are only needed to compile against
def findModsDir() {
    if (project.mods_dir) {
        return file(project.mods_dir)
    }
    def dir = projectDir
    while (dir != null && !new File(dir, 'minecraft/mods').isDirectory()) {
        dir = dir.parentFile
    }
    if (dir == null) {
        throw new GradleException('No minecraft/mods folder found above the project. Set mods_dir in gradle.properties.')
    }
    return new File(dir, 'minecraft/mods')
}

def packJars = fileTree(dir: findModsDir(), include: ['RLCombat-*.jar', 'ReachFix-*.jar'])
if (packJars.isEmpty()) {
    throw new GradleException("RLCombat and ReachFix jars not found in ${findModsDir()}")
}

minecraft {
    mcVersion = '1.12.2'
    mcpMappingChannel = project.mapping_channel
    mcpMappingVersion = project.mapping_version
    username = 'Developer'
    extraRunJvmArguments.add('-ea:automelee')
    injectedTags.set([VERSION: project.version.toString()])
}

tasks.named('injectTags', InjectTagsTask).configure {
    outputClassName.set('automelee.Tags')
}

repositories {
    mavenCentral()
}

dependencies {
    compileOnly rfg.deobf(packJars)

}

processResources {
    inputs.property('version', project.version)
    filesMatching('mcmod.info') {
        expand(
                modid: project.mod_id,
                mod_name: project.mod_name,
                mod_version: project.version)
    }
}

spotless {
    java {
        target 'src/*/java/**/*.java'
        googleJavaFormat('1.35.0')
    }
}
